<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="scanner-t scanner-d">
<title id="scanner-t">Secret scanning</title>
<desc id="scanner-d">Three detector layers feed one finding, which is either refused with exit 7 or allow-listed by fingerprint.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.b{font-weight:600}.bb{font-weight:700}
.ink{fill:#0f172a}.mut{fill:#5b6b7f}
.card{fill:#ffffff;stroke:#d7dee7;stroke-width:1.25}
.card2{fill:#f7f9fb;stroke:#e3e9f0;stroke-width:1.25}
.dash{fill:none;stroke:#c4cedb;stroke-width:1.25;stroke-dasharray:4 4}
.ln{fill:none;stroke:#c4cedb;stroke-width:1.5}
.vi{fill:#5733e8}.vis{fill:#f1edff;stroke:#cabcff;stroke-width:1.25}
.vil{fill:none;stroke:#8b6cff;stroke-width:1.5}.vif{fill:#8b6cff}
.bl{fill:#1558c0}.bls{fill:#eaf2ff;stroke:#bcd8ff;stroke-width:1.25}
.gr{fill:#076a48}.grs{fill:#e5f7ef;stroke:#a5e2c9;stroke-width:1.25}
.ro{fill:#b52348}.ros{fill:#fdecf0;stroke:#f6bdcb;stroke-width:1.25}
.rof{fill:#d32d56}
@media (prefers-color-scheme:dark){
.ink{fill:#e6edf3}.mut{fill:#9aa7b4}
.card{fill:#161b22;stroke:#30363d}
.card2{fill:#1b212b;stroke:#2b323d}
.dash{stroke:#3d4654}.ln{stroke:#3d4654}
.vi{fill:#c3b2ff}.vis{fill:#231c3c;stroke:#4a3a86}.vil{stroke:#7c63d8}.vif{fill:#9d86ff}
.bl{fill:#8cc0ff}.bls{fill:#15243c;stroke:#2b4b7d}
.gr{fill:#43c894}.grs{fill:#0f2a21;stroke:#275844}
.ro{fill:#ff9aae}.ros{fill:#331620;stroke:#6d2b41}.rof{fill:#ff8098}
}
</style>
<text class="ink b" x="48" y="48" font-size="15">No secret reaches the brain</text>
<text class="mut" x="48" y="70" font-size="12">Three detector layers on every write path. Detectors cannot be disabled, only allow-listed per finding.</text>
<rect class="card2" x="48" y="100" width="320" height="68" rx="11"/>
<circle class="bls" cx="78" cy="134" r="13"/>
<text class="bl b" x="78" y="138" font-size="12" text-anchor="middle">1</text>
<text class="ink b" x="102" y="129" font-size="13">Filename blocklist</text>
<text class="m mut" x="102" y="150" font-size="10.5">.env · *.pem · id_rsa · credentials.json</text>
<rect class="card2" x="48" y="184" width="320" height="68" rx="11"/>
<circle class="bls" cx="78" cy="218" r="13"/>
<text class="bl b" x="78" y="222" font-size="12" text-anchor="middle">2</text>
<text class="ink b" x="102" y="213" font-size="13">Known formats</text>
<text class="m mut" x="102" y="234" font-size="10.5">AKIA… · ghp_… · sk_live_… · BEGIN PRIVATE KEY</text>
<rect class="card2" x="48" y="268" width="320" height="68" rx="11"/>
<circle class="bls" cx="78" cy="302" r="13"/>
<text class="bl b" x="78" y="306" font-size="12" text-anchor="middle">3</text>
<text class="ink b" x="102" y="297" font-size="13">Generic assignment</text>
<text class="m mut" x="102" y="318" font-size="10.5">secret|token|password = &lt;12+ chars&gt;</text>
<path class="ln" d="M368,134 C420,134 420,218 470,218"/>
<path class="ln" d="M368,218 L470,218"/>
<path class="ln" d="M368,302 C420,302 420,218 470,218"/>
<rect class="card" x="470" y="182" width="96" height="72" rx="12"/>
<text class="ink b" x="518" y="214" font-size="12.5" text-anchor="middle">finding</text>
<text class="mut" x="518" y="232" font-size="10" text-anchor="middle">masked</text>
<path class="ln" d="M566,206 C592,206 596,176 620,176"/>
<path class="ln" d="M566,230 C592,230 596,292 620,292"/>
<rect class="ros" x="620" y="138" width="340" height="76" rx="12"/>
<text class="ro b" x="644" y="172" font-size="13">Refused, exit 7</text>
<text class="mut" x="644" y="193" font-size="11.5">nothing is committed; the value is masked to 4 chars</text>
<rect class="grs" x="620" y="254" width="340" height="76" rx="12"/>
<text class="gr b" x="644" y="288" font-size="13">Allow-listed</text>
<text class="mut" x="644" y="309" font-size="11.5">fingerprint + reason, recorded in git history</text>
<text class="mut" x="48" y="360" font-size="11.5">Runs on: thoughts sync · the brain’s pre-commit hook · thoughts new --set · thoughts init · thoughts scan</text>
</svg>
