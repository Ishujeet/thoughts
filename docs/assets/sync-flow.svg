<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="sync-flow-t sync-flow-d">
<title id="sync-flow-t">The sync pipeline</title>
<desc id="sync-flow-d">Sync runs scan, validate, regenerate, commit, pull, then push, with the exit code each step can produce.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.b{font-weight:600}.bb{font-weight:700}
.ink{fill:#0f172a}.mut{fill:#5b6b7f}
.card{fill:#ffffff;stroke:#d7dee7;stroke-width:1.25}
.card2{fill:#f7f9fb;stroke:#e3e9f0;stroke-width:1.25}
.dash{fill:none;stroke:#c4cedb;stroke-width:1.25;stroke-dasharray:4 4}
.ln{fill:none;stroke:#c4cedb;stroke-width:1.5}
.vi{fill:#5733e8}.vis{fill:#f1edff;stroke:#cabcff;stroke-width:1.25}
.vil{fill:none;stroke:#8b6cff;stroke-width:1.5}.vif{fill:#8b6cff}
.bl{fill:#1558c0}.bls{fill:#eaf2ff;stroke:#bcd8ff;stroke-width:1.25}
.gr{fill:#076a48}.grs{fill:#e5f7ef;stroke:#a5e2c9;stroke-width:1.25}
.ro{fill:#b52348}.ros{fill:#fdecf0;stroke:#f6bdcb;stroke-width:1.25}
.rof{fill:#d32d56}
@media (prefers-color-scheme:dark){
.ink{fill:#e6edf3}.mut{fill:#9aa7b4}
.card{fill:#161b22;stroke:#30363d}
.card2{fill:#1b212b;stroke:#2b323d}
.dash{stroke:#3d4654}.ln{stroke:#3d4654}
.vi{fill:#c3b2ff}.vis{fill:#231c3c;stroke:#4a3a86}.vil{stroke:#7c63d8}.vif{fill:#9d86ff}
.bl{fill:#8cc0ff}.bls{fill:#15243c;stroke:#2b4b7d}
.gr{fill:#43c894}.grs{fill:#0f2a21;stroke:#275844}
.ro{fill:#ff9aae}.ros{fill:#331620;stroke:#6d2b41}.rof{fill:#ff8098}
}
</style>
<text class="m ink b" x="48" y="44" font-size="14">thoughts sync</text>
<text class="mut" x="166" y="44" font-size="12.5">runs in a fixed order. The scan is a gate, and there is no bypass flag.</text>
<rect class="ros" x="53" y="84" width="134" height="64" rx="11"/>
<text class="ro b" x="120" y="114" font-size="13" text-anchor="middle">Scan</text>
<text class="mut" x="120" y="133" font-size="10.5" text-anchor="middle">secrets</text>
<path class="ln" d="M189,116 L196,116"/>
<path class="rof" opacity="0.45" d="M196,112 L203,116 L196,120 Z"/>
<rect class="card2" x="205" y="84" width="134" height="64" rx="11"/>
<text class="ink b" x="272" y="114" font-size="13" text-anchor="middle">Validate</text>
<text class="mut" x="272" y="133" font-size="10.5" text-anchor="middle">OKF frontmatter</text>
<path class="ln" d="M341,116 L348,116"/>
<path class="rof" opacity="0.45" d="M348,112 L355,116 L348,120 Z"/>
<rect class="card2" x="357" y="84" width="134" height="64" rx="11"/>
<text class="ink b" x="424" y="114" font-size="13" text-anchor="middle">Regenerate</text>
<text class="mut" x="424" y="133" font-size="10.5" text-anchor="middle">index.md + log.md</text>
<path class="ln" d="M493,116 L500,116"/>
<path class="rof" opacity="0.45" d="M500,112 L507,116 L500,120 Z"/>
<rect class="card2" x="509" y="84" width="134" height="64" rx="11"/>
<text class="ink b" x="576" y="114" font-size="13" text-anchor="middle">Commit</text>
<text class="mut" x="576" y="133" font-size="10.5" text-anchor="middle">one commit</text>
<path class="ln" d="M645,116 L652,116"/>
<path class="rof" opacity="0.45" d="M652,112 L659,116 L652,120 Z"/>
<rect class="card2" x="661" y="84" width="134" height="64" rx="11"/>
<text class="ink b" x="728" y="114" font-size="13" text-anchor="middle">Pull</text>
<text class="mut" x="728" y="133" font-size="10.5" text-anchor="middle">git pull --rebase</text>
<path class="ln" d="M797,116 L804,116"/>
<path class="rof" opacity="0.45" d="M804,112 L811,116 L804,120 Z"/>
<rect class="card2" x="813" y="84" width="134" height="64" rx="11"/>
<text class="ink b" x="880" y="114" font-size="13" text-anchor="middle">Push</text>
<text class="mut" x="880" y="133" font-size="10.5" text-anchor="middle">remote</text>
<rect class="ros" x="74" y="166" width="92" height="26" rx="13"/>
<text class="ro" x="120" y="183" font-size="11" text-anchor="middle">secret → 7</text>
<rect class="ros" x="226" y="166" width="92" height="26" rx="13"/>
<text class="ro" x="272" y="183" font-size="11" text-anchor="middle">invalid → 1</text>
<rect class="ros" x="682" y="166" width="92" height="26" rx="13"/>
<text class="ro" x="728" y="183" font-size="11" text-anchor="middle">conflict → 4</text>
<rect class="ros" x="834" y="166" width="92" height="26" rx="13"/>
<text class="ro" x="880" y="183" font-size="11" text-anchor="middle">offline → 2</text>
<text class="mut" x="48" y="222" font-size="11.5">Exit 0 on success. The local commit is made before the rebase, so offline work is never lost.</text>
</svg>
